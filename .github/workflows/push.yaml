name: push

on: push

jobs:
  layer:
    name: Layer
    runs-on: ubuntu-latest
    container:
      image: bref/php-85:v3
      volumes:
        - ${{ github.workspace }}:/opt/zero
    steps:
      - run: dnf -y install findutils gzip tar
      - uses: actions/checkout@v6
      - name: Composer
        id: composer
        uses: ./.github/actions/composer
      - run: find /opt/zero -name '*.php' -type f
