name: push

on: push

jobs:
  layer:
    name: Layer
    runs-on: ubuntu-latest
    container:
      image: bref/php-85:v3
      volumes:
        - ${{ github.workspace }}:/opt/zero
    steps:
      # - uses: ./.github/actions/prepare-al2023
      - run: dnf -y install findutils gzip tar
      - uses: actions/checkout@v6
      - run: curl --progress-bar --location --remote-name https://github.com/composer/composer/releases/download/2.9.4/composer.phar
      - run: /opt/bin/php composer.phar install --no-dev
      - run: find /opt -type d | sort
