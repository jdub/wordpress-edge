name: push

on: push

jobs:
  layer:
    name: Layer
    runs-on: ubuntu-latest
    container:
      image: bref/php-85:v3
      volumes:
        - ${{ github.workspace }}:/opt/zero
    steps:
      # - uses: ./.github/actions/prepare-al2023
      - run: dnf -y install findutils gzip tar
      - uses: actions/checkout@v6
      - uses: ./.github/actions/composer
      - run: /opt/bin/php /usr/local/bin/composer.phar config cache-files-dir
