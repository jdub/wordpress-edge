name: push

on: push

jobs:
  layer:
    name: Layer
    runs-on: ubuntu-latest
    container:
      image: bref/php-85:v3
      volumes:
        - ${{ github.workspace }}:/opt/zero
    steps:
      - run: dnf -y install findutils gzip tar
      - uses: actions/checkout@v6
      - name: Composer
        uses: ./.github/actions/composer
      - name: Prime the opcache
        run: ./.github/opcache.sh
      - uses: actions/upload-artifact@v6
        with:
          name: zero
          path: |
            /opt/bref
            /opt/zero/bootstrap.php
            /opt/zero/opcache
            /opt/zero/vendor
            /opt/zero/wordpress
            /opt/zero/wp-config.php
