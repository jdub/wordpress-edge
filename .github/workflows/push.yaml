name: push

on: push

jobs:
  layer:
    name: Layer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
      - run: composer install --no-dev
      - run: ./ci/opcache.sh
      - run: find zero -type f
