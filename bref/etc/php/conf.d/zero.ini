memory_limit = ${AWS_LAMBDA_FUNCTION_MEMORY_SIZE}M

opcache.blacklist_filename = /opt/bref/etc/php/blacklist.txt
opcache.enable_file_override = true
opcache.file_cache = /opt/zero/opcache
opcache.file_cache_consistency_checks = false
opcache.file_cache_only = false
opcache.file_cache_read_only = true
opcache.file_update_protection = 0
opcache.jit = function
opcache.log_verbosity_level = 4
opcache.validate_timestamps = 0
